<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AKS TIZIM</title>
<meta name="theme-color" content="#0B3D2E">
<meta name="author" content="Kamoliddin Naqiyev">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  html,body{margin:0;height:100%;background:#0B3D2E;font-family:Arial,sans-serif}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#F4F6F8}
  #ekran{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;gap:14px;padding:20px}
  #ekran img{width:120px;height:120px;border-radius:26px}
  #ekran .nom{font-size:22px;font-weight:bold;letter-spacing:.04em}
  #ekran .mut{font-size:13px;color:#C9D8D1}
  #ekran input{padding:12px;border-radius:10px;border:0;font-size:16px;width:260px;max-width:90vw}
  #ekran button{padding:12px 22px;border-radius:10px;border:0;background:#D4AF5A;color:#0B3D2E;font-weight:bold;font-size:16px;cursor:pointer}
  #ekran .muallif{position:fixed;bottom:18px;font-size:12px;color:#9FB8AD}
</style>
</head>
<body>
<div id="ekran">
  <img src="icon-192.png" alt="">
  <div class="nom">AKS TIZIM</div>
  <div class="mut" id="xabar">Yuklanmoqda…</div>
  <div class="muallif">Tizim muallifi va yaratuvchisi: <b>Kamoliddin Naqiyev</b></div>
</div>
<script>
const ILOVA = 'https://script.google.com/macros/s/AKfycbwOomLQADhrGSaSSebsAI3_A2Z6RlMUQcAz2Nk6ErNnSHIXKgUw9w8Cqnvol8pvdzvMIg/exec';
function saqla(k){ try{ localStorage.setItem('aks_k',k); }catch(e){} }
function ol(){ try{ return localStorage.getItem('aks_k')||''; }catch(e){ return ''; } }
const p = new URLSearchParams(location.search);
let k = (p.get('k')||'').trim();
if (k) { saqla(k); history.replaceState(null,'',location.pathname); } else k = ol();
if (p.has('chiqish')) { try{ localStorage.removeItem('aks_k'); }catch(e){} k=''; history.replaceState(null,'',location.pathname); }
function och(kod){
  const f=document.createElement('iframe');
  f.src = ILOVA + '?k=' + encodeURIComponent(kod);
  f.allow = 'clipboard-read; clipboard-write; fullscreen';
  f.onload = () => { const e=document.getElementById('ekran'); if(e) e.remove(); };
  document.body.appendChild(f);
}
if (k) och(k);
else {
  document.getElementById('xabar').innerHTML =
    'Shaxsiy kirish kodingizni kiriting<br><br><input id="kod" type="password" placeholder="Kirish kodi" autocomplete="off"><br><br><button id="kir">Kirish</button>';
  document.getElementById('kir').onclick = () => { const v=document.getElementById('kod').value.trim(); if(!v) return; saqla(v); location.reload(); };
  document.getElementById('kod').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('kir').click(); });
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
